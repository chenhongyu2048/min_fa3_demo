[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "min-fa3-vllm-plugin"
version = "0.1.0"
description = "vLLM integration for the min-FA3 Mega DCP benchmark"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.entry-points."vllm.general_plugins"]
min_fa3_dcp = "min_fa3_vllm_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

