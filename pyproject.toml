[build-system]
requires = [
    "setuptools==81.0.0",
    "wheel==0.47.0",
    "torch==2.11.0",
    "ninja==1.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "min_fa3_demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.1.3",
    "torch==2.11.0",
    "triton==3.6.0",
]

[dependency-groups]
build = [
    "cmake==4.4.2",
    "ninja==1.13.0",
    "pip==26.1.2",
    "pybind11==3.1.0",
    "setuptools==81.0.0",
    "versioningit==3.3.0",
    "wheel==0.47.0",
]
transformer-layer = [
    "debugpy==1.8.21",
    "einops==0.8.2",
    "importlib-metadata==9.0.1",
    "nvdlfw-inspect==0.2.2",
    "onnx==1.22.0",
    "onnxscript==0.7.1",
    "packaging==26.2",
    "pydantic==2.13.5",
]
plot = [
    "matplotlib==3.11.0",
]
dataset = [
    { include-group = "plot" },
    "datasets==5.0.0",
    "mosaicml-streaming==0.13.0",
    "requests==2.34.2",
    "tqdm==4.68.4",
    "torchvision==0.26.0",
    "transformers==4.57.6",
    "urllib3==2.7.0",
]

[tool.uv]
default-groups = ["build", "transformer-layer"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
