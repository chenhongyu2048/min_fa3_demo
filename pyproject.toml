[build-system]
requires = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "torch==2.10.0",
    "ninja==1.13.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "min_fa3_demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.1.3",
    "torch==2.10.0",
    "triton==3.6.0",
]

[dependency-groups]
build = [
    "ninja==1.13.0",
    "setuptools==83.0.0",
    "wheel==0.47.0",
]
plot = [
    "matplotlib==3.11.0",
]
dataset = [
    { include-group = "plot" },
    "datasets==5.0.0",
    "mosaicml-streaming==0.13.0",
    "requests==2.34.2",
    "tqdm==4.68.4",
    "transformers==4.57.6",
    "urllib3==2.7.0",
]
